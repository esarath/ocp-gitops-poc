name: Validate Multi-Tenancy Manifests

on:
  push:
    branches: [main]
    paths:
      - 'platform/multi-tenancy/**'
      - 'apps/app-of-apps/**'
      - '.github/workflows/validate-multi-tenancy.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'platform/multi-tenancy/**'
      - 'apps/app-of-apps/**'
      - '.github/workflows/validate-multi-tenancy.yaml'

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy: disable
              new-lines: disable
              braces: disable
            ignore: |
              platform/multi-tenancy/templates/helm/**/templates/
          file_or_dir: platform/multi-tenancy apps/app-of-apps

  kustomize-and-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: kustomize build (stage)
        run: kubectl kustomize platform/multi-tenancy/base/stage > /tmp/stage.yaml

      - name: kustomize build (prod)
        run: kubectl kustomize platform/multi-tenancy/base/prod > /tmp/prod.yaml

      - name: kustomize build (app-of-apps)
        run: kubectl kustomize apps/app-of-apps > /tmp/app-of-apps.yaml

      # `kubectl apply --dry-run=client` still needs a reachable API server
      # for discovery/RESTMapping regardless of --validate, so a disposable
      # local kind cluster stands in for api.lab.ocp.local (unreachable from
      # this runner). This also lets us use the stronger --dry-run=server
      # (real API-server admission validation, still non-mutating).
      - name: Create local kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: validate

      - name: Install ArgoCD CRDs (Application, AppProject — needed to validate app-of-apps.yaml)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/crds/application-crd.yaml
          kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/crds/appproject-crd.yaml
          kubectl wait --for=condition=Established --timeout=60s \
            crd/applications.argoproj.io crd/appprojects.argoproj.io

      # dry-run=server never persists the Namespace object it's handed, so a
      # namespaced resource later in the same file (ResourceQuota etc.) would
      # otherwise fail with "namespace not found". Pre-create the target
      # namespaces for real on this throwaway cluster (harmless — it's
      # deleted with the runner) so the rest of the dry-run is meaningful.
      - name: Pre-create target namespaces
        run: |
          kubectl create namespace stage --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace openshift-gitops --dry-run=client -o yaml | kubectl apply -f -

      - name: Server-side dry-run validate
        run: |
          kubectl apply --dry-run=server -f /tmp/stage.yaml
          kubectl apply --dry-run=server -f /tmp/prod.yaml
          kubectl apply --dry-run=server -f /tmp/app-of-apps.yaml

      - name: kubeconform (strict schema validation, incl. CRDs)
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -ignore-missing-schemas -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/stage.yaml /tmp/prod.yaml

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'
      - name: helm lint
        run: helm lint platform/multi-tenancy/templates/helm/tenant-namespace
      - name: helm template (stage + prod values)
        run: |
          helm template stage platform/multi-tenancy/templates/helm/tenant-namespace \
            -f platform/multi-tenancy/templates/helm/tenant-namespace/values-stage.yaml
          helm template prod platform/multi-tenancy/templates/helm/tenant-namespace \
            -f platform/multi-tenancy/templates/helm/tenant-namespace/values-prod.yaml

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.5'
      - name: fmt check
        run: terraform -chdir=platform/multi-tenancy/templates/terraform fmt -check -recursive
      - name: init + validate (module)
        run: |
          terraform -chdir=platform/multi-tenancy/templates/terraform/modules/tenant-namespace init -backend=false
          terraform -chdir=platform/multi-tenancy/templates/terraform/modules/tenant-namespace validate
      - name: init + validate (stage env)
        run: |
          terraform -chdir=platform/multi-tenancy/templates/terraform/environments/stage init -backend=false
          terraform -chdir=platform/multi-tenancy/templates/terraform/environments/stage validate
      - name: init + validate (prod env)
        run: |
          terraform -chdir=platform/multi-tenancy/templates/terraform/environments/prod init -backend=false
          terraform -chdir=platform/multi-tenancy/templates/terraform/environments/prod validate
      # terraform plan/apply require connectivity to api.lab.ocp.local, a
      # private lab network unreachable from GitHub-hosted runners — run
      # those locally (see templates/terraform/README.md).
