apiVersion: v1
kind: ResourceQuota
metadata:
  name: stage-quota
  namespace: stage
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
    persistentvolumeclaims: "5"
    services: "10"
    configmaps: "20"
    secrets: "20"
    count/deployments.apps: "10"
